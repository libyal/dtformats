[files]
extend-exclude = [
    "test_data/"
]

[default]
binary = false
check-filename = true
check-file = true
unicode = true
locale = "en-us"
extend-ignore-re = [
    # Ignore a line that is preceded with `# typos:ignore`
    "(#|//)\\s*typos:ignore\\n.*",

    # Ignore code blocks between `# typos:disable` and `# typos:enable`
    "(?s)(#|//)\\s*typos:disable.*?\\n\\s*(#|//)\\s*typos:enable",

    # Ignore "amcache.hve" (case-insensitive).
    "(?i)amcache\\.hve",

    # Ignore "syscache.hve" (case-insensitive).
    "(?i)syscache\\.hve",

    # Ignore "Big Sur"
    "\\bBig Sur\\b",

    # Ignore "kMDItemWhereFroms"
    "\\bkMDItemWhereFroms\\b",

    # Ignore "PN"
    "\\bPN\\b",
]
extend-words = {
    "alis" = "alis",
    "exportfs" = "exportfs",
}
